<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki Clone</title>

    <link rel="stylesheet" href="login_page.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="dashboard">

        <!-- HEADER -->
        <header class="header">

            <div class="logo">
                <h2>StudyCards</h2>
            </div>

            <nav>
                <ul>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-house"></i>
                            Início
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-layer-group"></i>
                            Meus Decks
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-chart-line"></i>
                            Estatísticas
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="user-profile">
                <i class="fa-solid fa-user"></i>
                <span id="user-info">William</span>
            </div>

        </header>

        <!-- MAIN -->
        <main class="content">

            <!-- ACTION CARDS -->
            <section class="cards-container">

                <div class="card" id="open-add-card">
                    <i class="fa-solid fa-plus"></i>
                    <h3>Adicionar Carta</h3>
                </div>

                <div class="card">
                    <i class="fa-solid fa-book-open"></i>
                    <h3>Revisar Cartas</h3>
                </div>

                <div class="card">
                    <i class="fa-solid fa-chart-simple"></i>
                    <h3>Estatísticas</h3>
                </div>

            </section>

            <!-- ADD CARD -->
            <section class="add-card-section" id="add-card-section">

                <h2>Adicionar Novo Cartão</h2>

                <form>

                    <label>Conteudo da frente</label>
                    <textarea
                    placeholder="Digite a pergunta"></textarea>

                    <label>Conteudo de trás</label>
                    <textarea
                    placeholder="Digite a resposta"></textarea>

                    <label>Deck</label>
                    <input type="text"
                    placeholder="Nome do deck">

                    <button type="submit">
                        Salvar Carta
                    </button>

                </form>

            </section>

            <!-- REVIEW -->
            <section class="review-section">

                <h2>Revisão</h2>

                <div class="review-card">

                    <h3>O que é Python?</h3>

                    <button>
                        Mostrar Resposta
                    </button>

                </div>

            </section>

        </main>

    </div>

<script src="index.js"></script>

</body>
</html>
